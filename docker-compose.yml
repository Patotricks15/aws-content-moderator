services:
  floci:
    image: floci/floci:latest
    container_name: floci-emulator
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_SERVICES: apigateway,cloudfront,comprehend,iam,lambda,logs,rekognition,s3,sagemaker,sagemakerruntime,sts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
